services:
  db:
    image: postgres:16
    container_name: student-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_db
    ports:
      - "5432:5432"
    volumes:
      - student_pgdata:/var/lib/postgresql/data

volumes:
  student_pgdata:
